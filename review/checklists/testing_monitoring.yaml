checklist_id: testing_monitoring_v1
plan_type: testing_monitoring
section_id: "8"
title: Testing and Monitoring Plan Checklist
description: >
  Review checklist for Class VI Testing and Monitoring Plans. This checklist
  defines the minimum technical topics that should be checked before a plan is
  considered review-ready.

items:
  - item_id: injection_pressure_monitoring
    label: Injection pressure monitoring
    description: >
      The plan should describe how injection pressure will be monitored, including
      whether pressure is measured at the wellhead, downhole, or annulus.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - injection pressure
      - wellhead pressure
      - downhole pressure
      - pressure transducer
      - pressure gauge
      - continuous recording
    evidence_groups:
      parameter:
        - injection pressure
        - wellhead pressure
        - downhole pressure
      equipment:
        - pressure transducer
        - pressure gauge
      frequency:
        - continuous recording
        - continuous
      location:
        - wellhead
        - downhole
        - annulus
    reference_queries:
      - What does Class VI require for injection pressure monitoring?
      - What does EPA guidance say about continuous pressure monitoring?
    permit_precedent_queries:
      - How do applicants monitor injection pressure?
      - How do permit applications describe pressure transducers or gauges?
    recommended_fix: >
      Add a clear description of injection pressure monitoring devices,
      measurement location, recording frequency, and how pressure data will be used.

  - item_id: injection_rate_monitoring
    label: Injection rate and flow monitoring
    description: >
      The plan should describe how injection rate or flow rate will be monitored.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - injection rate
      - flow rate
      - mass flow rate
      - mass flowmeter
      - Coriolis meter
      - orifice meter
      - flow computer
    evidence_groups:
      parameter:
        - injection rate
        - flow rate
        - mass flow rate
      equipment:
        - mass flowmeter
        - Coriolis meter
        - orifice meter
        - flow computer
      recording:
        - continuous
        - continuous recording
        - SCADA
    reference_queries:
      - What does Class VI require for injection rate monitoring?
      - What does EPA guidance say about monitoring flow rate?
    permit_precedent_queries:
      - How do applicants monitor injection flow rate?
      - How do applicants use Coriolis or orifice meters for injection monitoring?
    recommended_fix: >
      Add the flow-rate monitoring method, device type, location, calibration approach,
      and whether data are continuously recorded.

  - item_id: injection_volume_monitoring
    label: Injection volume monitoring
    description: >
      The plan should describe how injected volume will be calculated, recorded,
      and used in operational or computational models.
    requirement_level: required
    severity: moderate
    expected_evidence_terms:
      - injection volume
      - injected volume
      - cumulative volume
      - calculated volume
      - injection mass
      - computational model
    evidence_groups:
      parameter:
        - injection volume
        - injected volume
        - cumulative volume
        - injection mass
      calculation:
        - calculated volume
        - computational model
      usage:
        - operational tracking
        - modeling
        - computational model
    reference_queries:
      - What does Class VI require for injection volume monitoring?
    permit_precedent_queries:
      - How do applicants calculate injection volume?
      - How do applicants use injection volume in computational models?
    recommended_fix: >
      Add how injection volume is calculated, recorded, and used for modeling or
      operational tracking.

  - item_id: annular_pressure_monitoring
    label: Annular pressure monitoring
    description: >
      The plan should describe monitoring of annular pressure or annulus fluid
      volumes where applicable.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - annular pressure
      - annulus pressure
      - annulus fluid
      - casing annulus
      - tubing and long-string casing
    evidence_groups:
      parameter:
        - annular pressure
        - annulus pressure
        - annulus fluid
      location:
        - casing annulus
        - tubing and long-string casing
        - annulus
      response:
        - abnormal annular pressure
        - response actions
    reference_queries:
      - What does Class VI require for annular pressure monitoring?
    permit_precedent_queries:
      - How do applicants monitor annular pressure?
      - How do applicants describe annulus pressure monitoring?
    recommended_fix: >
      Add annular pressure monitoring location, device, frequency, and response
      actions for abnormal annular pressure.

  - item_id: monitoring_frequency
    label: Monitoring frequency
    description: >
      The plan should state how often each monitoring parameter is measured or recorded.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - continuous
      - frequency
      - sampling rate
      - once per second
      - recording frequency
      - monitoring frequency
    evidence_groups:
      frequency:
        - continuous
        - frequency
        - sampling rate
        - once per second
        - recording frequency
        - monitoring frequency
      parameter_link:
        - pressure
        - flow rate
        - volume
        - temperature
        - annular pressure
    reference_queries:
      - What monitoring frequency does Class VI require?
      - What does EPA guidance say about continuous monitoring?
    permit_precedent_queries:
      - How do applicants describe monitoring frequency?
      - How do applicants describe continuous recording devices?
    recommended_fix: >
      Add monitoring frequency for each parameter, especially pressure, flow rate,
      volume, temperature, and annular pressure.

  - item_id: monitoring_locations
    label: Monitoring locations
    description: >
      The plan should identify where each monitoring parameter is measured.
    requirement_level: required
    severity: moderate
    expected_evidence_terms:
      - surface
      - wellhead
      - downhole
      - near injection packer
      - reservoir
      - monitoring location
      - injection line
    evidence_groups:
      surface_location:
        - surface
        - wellhead
        - injection line
      subsurface_location:
        - downhole
        - near injection packer
        - reservoir
      location_description:
        - monitoring location
    reference_queries:
      - What does Class VI require for monitoring locations?
    permit_precedent_queries:
      - How do applicants describe monitoring locations for pressure and flow?
    recommended_fix: >
      Add monitoring locations for each parameter and clarify whether measurements
      are taken at the surface, wellhead, downhole, annulus, reservoir, or injection line.

  - item_id: monitoring_equipment
    label: Monitoring equipment and devices
    description: >
      The plan should identify equipment used to collect monitoring data.
    requirement_level: required
    severity: moderate
    expected_evidence_terms:
      - pressure transducer
      - pressure gauge
      - temperature sensor
      - Coriolis meter
      - orifice meter
      - flow meter
      - SCADA
      - data logger
    evidence_groups:
      pressure_equipment:
        - pressure transducer
        - pressure gauge
      temperature_equipment:
        - temperature sensor
      flow_equipment:
        - Coriolis meter
        - orifice meter
        - flow meter
      recording_system:
        - SCADA
        - data logger
    reference_queries:
      - What monitoring equipment is expected in a Class VI Testing and Monitoring Plan?
    permit_precedent_queries:
      - What equipment do applicants use for pressure and flow monitoring?
    recommended_fix: >
      Add device names, measurement parameters, and locations for each monitoring device.

  - item_id: calibration_schedule
    label: Calibration schedule
    description: >
      The plan should describe calibration frequency or quality control for monitoring equipment.
    requirement_level: recommended
    severity: moderate
    expected_evidence_terms:
      - calibration
      - calibrated annually
      - manufacturer recommended
      - certified calibration
      - quality assurance
      - drift stability
      - accuracy
    evidence_groups:
      calibration_activity:
        - calibration
        - certified calibration
      frequency:
        - calibrated annually
        - manufacturer recommended
      quality_control:
        - quality assurance
        - drift stability
        - accuracy
    reference_queries:
      - What does EPA guidance say about calibration of monitoring equipment?
    permit_precedent_queries:
      - How do applicants describe calibration schedules for flow meters and pressure gauges?
    recommended_fix: >
      Add calibration frequency, calibration standard, and quality control procedures
      for pressure, temperature, and flow monitoring devices.

  - item_id: scada_or_data_recording
    label: SCADA or data recording system
    description: >
      The plan should describe whether monitoring data are continuously recorded,
      stored, or connected to a control system.
    requirement_level: recommended
    severity: moderate
    expected_evidence_terms:
      - SCADA
      - continuous recording devices
      - control system
      - data logger
      - analog output
      - operational parameters
      - electronic submit
      - electronically submit
      - graphs
      - daily values
      - monitoring results
      - records
      - tabulation
    evidence_groups:
      system:
        - SCADA
        - control system
        - data logger
      recording:
        - continuous recording devices
        - analog output
        - operational parameters
      reporting:
        - electronic submit
        - electronically submit
        - graphs
        - daily values
        - monitoring results
        - records
        - tabulation
    reference_queries:
      - What does Class VI require for recording operational parameters?
    permit_precedent_queries:
      - How do applicants use SCADA or continuous recording systems?
    recommended_fix: >
      Add how monitoring devices connect to data recording, SCADA, or operational
      control systems.

  - item_id: anomaly_response
    label: Response to anomalous monitoring results
    description: >
      The plan should explain how abnormal pressure, flow, or monitoring results
      will be investigated or addressed.
    requirement_level: recommended
    severity: moderate
    expected_evidence_terms:
      - anomaly
      - anomalous pressure
      - investigation
      - trigger
      - abnormal
      - loss of mechanical integrity
      - blockage
    reference_queries:
      - What does EPA guidance say about responding to anomalous monitoring results?
    permit_precedent_queries:
      - How do applicants respond to anomalous pressure or flow readings?
    recommended_fix: >
      Add trigger conditions and response actions for anomalous monitoring results.

  - item_id: reporting_procedure
    label: Reporting procedure
    description: >
      The plan should describe how monitoring results will be reported or used in
      compliance documentation.
    requirement_level: recommended
    severity: minor
    expected_evidence_terms:
      - report
      - reporting
      - annual report
      - compliance
      - submitted
      - records
    reference_queries:
      - What reporting is required for Class VI monitoring data?
    permit_precedent_queries:
      - How do applicants report testing and monitoring results?
    recommended_fix: >
      Add reporting frequency, reporting destination, and which monitoring data
      will be included in compliance records.
      
  - item_id: co2_stream_analysis
    label: CO2 stream analysis
    description: >
      The plan should describe how the carbon dioxide stream will be sampled,
      analyzed, and reported, including composition and impurities relevant to
      corrosion, compatibility, and USDW protection.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - carbon dioxide stream
      - CO2 stream
      - stream composition
      - flue gas analysis
      - impurities
      - laboratory analysis
      - sampling
      - chemical analysis
      - corrosion
      - compatibility
    evidence_groups:
      stream_identity:
        - carbon dioxide stream
        - CO2 stream
        - stream composition
      analytical_method:
        - flue gas analysis
        - laboratory analysis
        - chemical analysis
        - sampling
      risk_relevance:
        - impurities
        - corrosion
        - compatibility
    reference_queries:
      - What does EPA Testing and Monitoring Guidance say about analysis of the carbon dioxide stream?
      - What Class VI monitoring information is expected for CO2 stream composition?
    permit_precedent_queries:
      - How do Class VI applicants describe CO2 stream analysis?
      - What permit precedent exists for CO2 stream sampling and reporting?
    recommended_fix: >
      Add how the CO2 stream will be sampled and analyzed, including composition,
      impurities, reporting procedures, and relevance to corrosion and compatibility.

  - item_id: groundwater_geochemical_monitoring
    label: Groundwater and geochemical monitoring
    description: >
      The plan should describe groundwater quality and geochemical monitoring,
      including monitoring wells, sampling intervals, analytes, methods, and
      baseline comparison.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - groundwater monitoring
      - ground water monitoring
      - geochemical monitoring
      - monitoring wells
      - groundwater samples
      - analytes
      - water quality
      - baseline
      - sampling interval
      - laboratory analysis
    evidence_groups:
      monitoring_network:
        - groundwater monitoring
        - ground water monitoring
        - monitoring wells
      sampling_program:
        - groundwater samples
        - sampling interval
        - laboratory analysis
      analytical_scope:
        - geochemical monitoring
        - analytes
        - water quality
        - baseline
    reference_queries:
      - What does EPA Testing and Monitoring Guidance say about groundwater quality and geochemical monitoring?
      - What groundwater monitoring information is expected in a Class VI Testing and Monitoring Plan?
    permit_precedent_queries:
      - How do Class VI applicants describe groundwater and geochemical monitoring?
      - What permit precedent exists for monitoring well networks and groundwater sampling?
    recommended_fix: >
      Add groundwater and geochemical monitoring details, including monitoring well
      locations, sampling intervals, analytes, methods, and baseline comparison.

  - item_id: plume_pressure_front_tracking
    label: Plume and pressure-front tracking
    description: >
      The plan should describe how the carbon dioxide plume and pressure front
      will be tracked using direct or indirect monitoring methods and compared
      against model predictions.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - plume tracking
      - pressure front tracking
      - plume and pressure front
      - pressure-front
      - time-lapse seismic
      - geophysical monitoring
      - pressure monitoring
      - model predictions
      - AoR reevaluation
      - indirect monitoring
    evidence_groups:
      tracking_targets:
        - plume tracking
        - pressure front tracking
        - plume and pressure front
        - pressure-front
      methods:
        - time-lapse seismic
        - geophysical monitoring
        - pressure monitoring
        - indirect monitoring
      model_comparison:
        - model predictions
        - AoR reevaluation
    reference_queries:
      - What does EPA Testing and Monitoring Guidance say about plume and pressure-front tracking?
      - How should Class VI applicants track the CO2 plume and associated pressure front?
    permit_precedent_queries:
      - How do Class VI applicants describe plume and pressure-front tracking?
      - What permit precedent exists for seismic geophysical or pressure-front monitoring?
    recommended_fix: >
      Add plume and pressure-front tracking methods, monitoring frequency, model
      comparison approach, and how results will inform AoR reevaluation.

  - item_id: mechanical_integrity_testing
    label: Mechanical integrity testing
    description: >
      The plan should describe internal and external mechanical integrity tests,
      including test methods, frequency, acceptance criteria, and response to
      loss of mechanical integrity.
    requirement_level: required
    severity: critical
    expected_evidence_terms:
      - mechanical integrity test
      - mechanical integrity testing
      - MIT
      - internal MIT
      - external MIT
      - annulus pressure test
      - radioactive tracer survey
      - temperature log
      - noise log
      - oxygen activation log
      - loss of mechanical integrity
    evidence_groups:
      mit_scope:
        - mechanical integrity test
        - mechanical integrity testing
        - MIT
      internal_mit:
        - internal MIT
        - annulus pressure test
      external_mit:
        - external MIT
        - radioactive tracer survey
        - temperature log
        - noise log
        - oxygen activation log
      response:
        - loss of mechanical integrity
    reference_queries:
      - What does EPA Testing and Monitoring Guidance say about mechanical integrity testing?
      - What internal and external MITs are expected for Class VI wells?
    permit_precedent_queries:
      - How do Class VI applicants describe mechanical integrity testing?
      - What permit precedent exists for internal and external MITs?
    recommended_fix: >
      Add internal and external MIT methods, frequency, acceptance criteria, and
      response actions for suspected or confirmed loss of mechanical integrity.

  - item_id: corrosion_monitoring
    label: Corrosion monitoring
    description: >
      The plan should describe corrosion monitoring methods used to evaluate
      well materials and system integrity during operation.
    requirement_level: required
    severity: moderate
    expected_evidence_terms:
      - corrosion monitoring
      - corrosion coupon
      - corrosion coupons
      - corrosion loop
      - casing inspection log
      - CIL
      - material degradation
      - corrosion rate
      - fluid compatibility
    evidence_groups:
      corrosion_methods:
        - corrosion monitoring
        - corrosion coupon
        - corrosion coupons
        - corrosion loop
        - casing inspection log
        - CIL
      evaluation:
        - material degradation
        - corrosion rate
        - fluid compatibility
    reference_queries:
      - What does EPA Testing and Monitoring Guidance say about corrosion monitoring?
      - What corrosion monitoring information is expected for Class VI injection wells?
    permit_precedent_queries:
      - How do Class VI applicants describe corrosion monitoring?
      - What permit precedent exists for corrosion coupons loops or casing inspection logs?
    recommended_fix: >
      Add corrosion monitoring methods, monitoring frequency, evaluation criteria,
      and how corrosion results will be used to protect well integrity.

  - item_id: surface_air_soil_gas_monitoring
    label: Surface air and soil gas monitoring
    description: >
      The plan should describe whether surface air or soil gas monitoring will be
      performed, or explain why it is not proposed or required for the site.
    requirement_level: recommended
    severity: moderate
    expected_evidence_terms:
      - surface air monitoring
      - soil gas monitoring
      - soil flux
      - flux chamber
      - CO2 detector
      - leakage detection
      - surface expression
      - not proposed
      - not required
      - site-specific
    evidence_groups:
      monitoring_methods:
        - surface air monitoring
        - soil gas monitoring
        - soil flux
        - flux chamber
        - CO2 detector
      objective:
        - leakage detection
        - surface expression
      applicability:
        - not proposed
        - not required
        - site-specific
    reference_queries:
      - What does EPA Testing and Monitoring Guidance say about surface air and soil gas monitoring?
      - When should Class VI applicants include surface air or soil gas monitoring?
    permit_precedent_queries:
      - How do Class VI applicants describe surface air and soil gas monitoring?
      - What permit precedent exists for soil gas or surface air monitoring decisions?
    recommended_fix: >
      Add surface air or soil gas monitoring methods, or explain why they are not
      proposed based on site-specific conditions and monitoring objectives.
