checklist_id: aor_corrective_action_v1
plan_type: aor_corrective_action
section_id: '3'
title: AoR and Corrective Action Plan Checklist
description: Review checklist for Area of Review and Corrective Action Plans.
items:
- item_id: aor_delineation
  label: AoR delineation
  description: The plan should describe how the Area of Review is delineated.
  requirement_level: required
  severity: critical
  expected_evidence_terms:
  - area of review
  - AoR
  - pressure front
  - plume
  - computational model
  evidence_groups:
    aor_definition:
      - area of review
      - AoR
    predicted_extent:
      - pressure front
      - plume
    model_basis:
      - computational model
  reference_queries:
  - What does Class VI require for aor delineation?
  - What does EPA guidance say about aor delineation?
  permit_precedent_queries:
  - How do applicants describe aor delineation?
  - What permit precedent exists for aor delineation?
  recommended_fix: Add the AoR delineation method, model basis, and maps.
- item_id: computational_model
  label: Computational model
  description: The plan should describe the model used to define plume and pressure-front extent.
  requirement_level: required
  severity: critical
  expected_evidence_terms:
  - computational model
  - simulation
  - model domain
  - pressure front
  - plume
  evidence_groups:
    model:
      - computational model
      - simulation
    domain:
      - model domain
    predicted_extent:
      - pressure front
      - plume
  reference_queries:
  - What does Class VI require for computational model?
  - What does EPA guidance say about computational model?
  permit_precedent_queries:
  - How do applicants describe computational model?
  - What permit precedent exists for computational model?
  recommended_fix: Add model assumptions, parameters, calibration, uncertainty, and predicted extents.
- item_id: penetrating_wells
  label: Artificial penetrations
  description: The plan should identify wells or penetrations within the AoR.
  requirement_level: required
  severity: critical
  expected_evidence_terms:
  - artificial penetrations
  - legacy wells
  - wells within the AoR
  - well inventory
  evidence_groups:
    penetrations:
      - artificial penetrations
      - legacy wells
      - wells within the AoR
    inventory:
      - well inventory
  reference_queries:
  - What does Class VI require for artificial penetrations?
  - What does EPA guidance say about artificial penetrations?
  permit_precedent_queries:
  - How do applicants describe artificial penetrations?
  - What permit precedent exists for artificial penetrations?
  recommended_fix: Add a complete inventory and evaluation of wells and artificial penetrations.
- item_id: corrective_action_plan
  label: Corrective action plan
  description: The plan should describe corrective action for deficient wells or penetrations.
  requirement_level: required
  severity: critical
  expected_evidence_terms:
  - corrective action
  - plugging
  - remediation
  - deficient wells
  - wellbore
  evidence_groups:
    action:
      - corrective action
      - remediation
    method:
      - plugging
    target:
      - deficient wells
      - wellbore
  reference_queries:
  - What does Class VI require for corrective action plan?
  - What does EPA guidance say about corrective action plan?
  permit_precedent_queries:
  - How do applicants describe corrective action plan?
  - What permit precedent exists for corrective action plan?
  recommended_fix: Add corrective action methods, schedule, and verification requirements.
- item_id: aor_reevaluation
  label: AoR reevaluation
  description: The plan should describe when AoR reevaluation occurs.
  requirement_level: recommended
  severity: moderate
  expected_evidence_terms:
  - reevaluation
  - re-evaluation
  - model update
  - monitoring data
  - AoR update
  evidence_groups:
    reevaluation:
      - reevaluation
      - re-evaluation
    triggers:
      - monitoring data
    updates:
      - model update
      - AoR update
  reference_queries:
  - What does Class VI require for aor reevaluation?
  - What does EPA guidance say about aor reevaluation?
  permit_precedent_queries:
  - How do applicants describe aor reevaluation?
  - What permit precedent exists for aor reevaluation?
  recommended_fix: Add reevaluation triggers, frequency, and update procedure.
